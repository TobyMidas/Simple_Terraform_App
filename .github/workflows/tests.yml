name: Trivy Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  Docker_Scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t basiccalculator .

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: basiccalculator:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true